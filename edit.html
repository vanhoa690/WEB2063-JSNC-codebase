<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chỉnh sửa - WEB2064 JSNC</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="min-h-screen bg-slate-100 text-slate-800">
    <nav class="bg-indigo-700 text-white shadow">
      <div
        class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4"
      >
        <a href="index.html" class="text-xl font-bold">WEB2064 JSNC</a>

        <div class="flex gap-4 text-sm">
          <a href="index.html" class="hover:text-indigo-200">Danh sách</a>
          <a href="add.html" class="hover:text-indigo-200">Thêm mới</a>
          <button id="logoutButton" type="button" class="hover:text-indigo-200">
            Đăng xuất
          </button>
        </div>
      </div>
    </nav>

    <main class="mx-auto max-w-3xl px-4 py-10">
      <section class="rounded-2xl bg-white p-6 shadow-lg sm:p-8">
        <div class="mb-6">
          <h1 class="text-3xl font-bold text-indigo-700">Chỉnh sửa</h1>
          <p class="mt-2 text-sm text-slate-500">
            Cập nhật thông tin bản ghi đã chọn.
          </p>
        </div>

        <form id="form-edit" novalidate>
          <div class="mb-4">
            <label for="name" class="mb-1 block text-sm font-medium">
              Tên
            </label>
            <input
              id="name"
              name="name"
              type="text"
              placeholder="Nhập tên"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
            />
            <p id="nameError" class="mt-1 hidden text-sm text-red-600"></p>
          </div>

          <div class="mb-4">
            <label for="duration" class="mb-1 block text-sm font-medium">
              Thời lượng
            </label>
            <input
              id="duration"
              name="duration"
              type="number"
              min="1"
              placeholder="Nhập thời lượng"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
            />
            <p id="durationError" class="mt-1 hidden text-sm text-red-600"></p>
          </div>

          <div class="mb-4">
            <label for="thumbnail" class="mb-1 block text-sm font-medium">
              Đường dẫn ảnh
            </label>
            <input
              id="thumbnail"
              name="thumbnail"
              type="url"
              placeholder="https://example.com/image.jpg"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
            />
            <p id="thumbnailError" class="mt-1 hidden text-sm text-red-600"></p>
          </div>

          <div class="mb-6">
            <label for="category" class="mb-1 block text-sm font-medium">
              Danh mục
            </label>
            <select
              id="category"
              name="category"
              class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
            >
              <option value="">-- Chọn danh mục --</option>
              <option value="Frontend">Frontend</option>
              <option value="Backend">Backend</option>
              <option value="Mobile">Mobile</option>
            </select>
            <p id="categoryError" class="mt-1 hidden text-sm text-red-600"></p>
          </div>

          <div
            id="message"
            class="mb-4 hidden rounded-lg px-4 py-3 text-sm"
            role="status"
            aria-live="polite"
          ></div>

          <div class="flex flex-col gap-3 sm:flex-row">
            <button
              id="submitButton"
              type="submit"
              class="rounded-lg bg-indigo-600 px-5 py-3 font-semibold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:opacity-60"
            >
              Cập nhật
            </button>

            <a
              href="index.html"
              class="rounded-lg border border-slate-300 px-5 py-3 text-center font-semibold text-slate-700 transition hover:bg-slate-50"
            >
              Hủy
            </a>
          </div>

          <p id="loading" class="mt-3 hidden text-sm text-slate-500">
            Đang tải hoặc cập nhật dữ liệu, vui lòng chờ...
          </p>
        </form>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
    <script src="./edit.js"></script>
  </body>
</html>
