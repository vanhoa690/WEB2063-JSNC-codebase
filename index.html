<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danh sách - WEB2064 JSNC</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="min-h-screen bg-slate-100 text-slate-800">
    <!-- Navigation -->
    <nav class="bg-indigo-700 text-white shadow">
      <div
        class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4"
      >
        <a href="index.html" class="text-xl font-bold">WEB2064 JSNC</a>

        <div class="flex items-center gap-4 text-sm">
          <a
            href="index.html"
            class="font-semibold underline hover:text-indigo-200"
          >
            Danh sách
          </a>

          <a href="add.html" class="hover:text-indigo-200">Thêm mới</a>

          <a href="register.html" class="hover:text-indigo-200">Đăng ký</a>

          <a href="login.html" class="hover:text-indigo-200">Đăng nhập</a>

          <button
            id="logoutButton"
            type="button"
            class="hidden hover:text-indigo-200"
          >
            Đăng xuất
          </button>
        </div>
      </div>
    </nav>

    <!-- Main content -->
    <main class="mx-auto max-w-6xl px-4 py-10">
      <section class="rounded-2xl bg-white p-6 shadow-lg sm:p-8">
        <!-- Page heading -->
        <div
          class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between"
        >
          <div>
            <h1 id="title" class="text-3xl font-bold text-indigo-700">
              Danh sách tin tuyển dụng
            </h1>

            <p class="mt-2 text-sm text-slate-500">
              Quản lý thông tin tin tuyển dụng trong hệ thống.
            </p>
          </div>

          <a
            id="addButton"
            href="add.html"
            class="inline-flex items-center justify-center rounded-lg bg-indigo-600 px-4 py-3 font-semibold text-white transition hover:bg-indigo-700"
          >
            + Thêm mới
          </a>
        </div>

        <!-- Movie table -->
        <div class="overflow-x-auto rounded-xl border border-slate-200">
          <table class="w-full min-w-[760px] border-collapse text-left text-sm">
            <thead class="bg-indigo-50 text-slate-700">
              <tr>
                <th class="border-b border-slate-200 px-4 py-3 text-center">
                  ID
                </th>

                <th class="border-b border-slate-200 px-4 py-3">
                  Tên tin tuyển dụng
                </th>

                <th class="border-b border-slate-200 px-4 py-3 text-center">
                  Thời lượng
                </th>

                <th class="border-b border-slate-200 px-4 py-3 text-center">
                  Hình ảnh
                </th>

                <th class="border-b border-slate-200 px-4 py-3">Danh mục</th>

                <th class="border-b border-slate-200 px-4 py-3 text-center">
                  Chức năng
                </th>
              </tr>
            </thead>

            <tbody id="movie-list" class="divide-y divide-slate-100">
              <!-- index.js sẽ render dữ liệu tin tuyển dụng tại đây -->
              <tr>
                <td colspan="6" class="px-4 py-8 text-center text-slate-500">
                  Đang chờ dữ liệu...
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Footer note -->
        <p class="mt-4 text-sm text-slate-500">
          Sử dụng các chức năng Sửa và Xóa để quản lý thông tin tin tuyển dụng.
        </p>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
    <script src="./index.js"></script>
  </body>
</html>
